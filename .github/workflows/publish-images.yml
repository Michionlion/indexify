name: Publish and deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/michionlion/indexify

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.release.outputs.current }}
    steps:
      - name: Check that this is still the newest main commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${latest_sha}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "A newer main commit exists; this image will not be deployed."
          fi

  deploy:
    needs: release
    if: needs.release.outputs.current == 'true'
    environment: production
    runs-on: [self-hosted, linux, production]
    concurrency:
      group: indexify-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy exact production release
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_dir=/mnt/data/deploy/indexify
          release_file="${deploy_dir}/.release.env"
          candidate_file="$(mktemp "${deploy_dir}/.release.env.XXXXXX")"
          docker_config="$(mktemp -d)"
          cleanup() {
            rm -f "${candidate_file}"
            rm -rf "${docker_config}"
          }
          trap cleanup EXIT
          printf 'IMAGE_REF=%s\n' \
            "${IMAGE_NAME}:sha-${RELEASE_SHA}" > "${candidate_file}"
          printf '%s' "${GHCR_TOKEN}" | \
            docker --config "${docker_config}" login ghcr.io \
              --username "${GITHUB_ACTOR}" --password-stdin
          docker --config "${docker_config}" compose \
            --file "${deploy_dir}/compose.yaml" \
            --project-directory "${deploy_dir}" \
            --env-file "${deploy_dir}/.env" \
            --env-file "${candidate_file}" pull
          if ! docker --config "${docker_config}" compose \
            --file "${deploy_dir}/compose.yaml" \
            --project-directory "${deploy_dir}" \
            --env-file "${deploy_dir}/.env" \
            --env-file "${candidate_file}" \
            up -d --remove-orphans --wait; then
            docker --config "${docker_config}" compose \
              --file "${deploy_dir}/compose.yaml" \
              --project-directory "${deploy_dir}" \
              --env-file "${deploy_dir}/.env" \
              --env-file "${release_file}" \
              up -d --remove-orphans --wait || true
            exit 1
          fi
          chmod 640 "${candidate_file}"
          mv "${candidate_file}" "${release_file}"
